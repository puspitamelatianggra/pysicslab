<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 326" role="img" aria-label="Tiga hubungan roda-roda. Sepusat: kecepatan sudut kedua roda sama. Dihubungkan rantai: kecepatan linear kedua roda sama dan arah putarnya sama. Bersinggungan: kecepatan linear kedua roda sama tetapi arah putarnya berlawanan">
  <defs>
    <style>
      .bayang { fill: #1A1A1A; }
      .panel { fill: #FFFFFF; stroke: #1A1A1A; stroke-width: 3; }
      .kepala { fill: #C5FA00; stroke: #1A1A1A; stroke-width: 3; }
      .judul { font: 700 16px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .label { font: 700 16px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .kecil { font: 500 12.5px Inter, Arial, sans-serif; fill: #475569; }
      .roda { fill: #FFF7ED; stroke: #1A1A1A; stroke-width: 3; }
      .roda-dalam { fill: #FFFFFF; stroke: #1A1A1A; stroke-width: 3; }
      .rantai { stroke: #1A1A1A; stroke-width: 3; fill: none; }
      .putar { stroke: #FF6B00; stroke-width: 3; stroke-dasharray: 7 5; fill: none; }
      .komponen { stroke: #FF6B00; stroke-width: 3.5; fill: none; }
      .pusat { fill: #1A1A1A; }
    </style>
    <marker id="panah-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF6B00"/>
    </marker>
  </defs>

  <!-- ===== 1. Sepusat ===== -->
  <g transform="translate(4,4)">
    <rect class="bayang" x="6" y="6" width="290" height="310"/>
    <rect class="panel" x="0" y="0" width="290" height="310"/>
    <rect class="kepala" x="0" y="0" width="290" height="42"/>
    <text class="judul" x="16" y="27">1. Sepusat</text>

    <circle class="roda" cx="145" cy="170" r="85"/>
    <circle class="roda-dalam" cx="145" cy="170" r="40"/>
    <circle class="pusat" cx="145" cy="170" r="4"/>
    <path class="putar" d="M74.3,99.3 A100,100 0 0 1 215.7,99.3" marker-end="url(#panah-o)"/>
    <path class="putar" d="M106.1,131.1 A55,55 0 0 1 183.9,131.1" marker-end="url(#panah-o)"/>
    <text class="label" x="145" y="200" text-anchor="middle">A</text>
    <text class="label" x="145" y="240" text-anchor="middle">B</text>

    <text class="label" x="145" y="282" text-anchor="middle">ω<tspan font-size="11" dy="4">A</tspan><tspan dy="-4"> = ω</tspan><tspan font-size="11" dy="4">B</tspan></text>
    <text class="kecil" x="145" y="300" text-anchor="middle">arah putar sama</text>
  </g>

  <!-- ===== 2. Dihubungkan rantai ===== -->
  <g transform="translate(322,4)">
    <rect class="bayang" x="6" y="6" width="290" height="310"/>
    <rect class="panel" x="0" y="0" width="290" height="310"/>
    <rect class="kepala" x="0" y="0" width="290" height="42"/>
    <text class="judul" x="16" y="27">2. Dihubungkan rantai</text>

    <path class="rantai" d="M68.1,140.8 L191.2,111.6 M68.1,199.2 L191.2,228.4"/>
    <circle class="roda" cx="75" cy="170" r="30"/>
    <circle class="roda" cx="205" cy="170" r="60"/>
    <circle class="pusat" cx="75" cy="170" r="4"/>
    <circle class="pusat" cx="205" cy="170" r="4"/>
    <path class="komponen" d="M117.3,129.1 L156.2,119.9" marker-end="url(#panah-o)"/>
    <text class="label" x="134" y="112" text-anchor="middle">v</text>
    <text class="label" x="75" y="250" text-anchor="middle">A</text>
    <text class="label" x="205" y="256" text-anchor="middle">B</text>

    <text class="label" x="145" y="282" text-anchor="middle">v<tspan font-size="11" dy="4">A</tspan><tspan dy="-4"> = v</tspan><tspan font-size="11" dy="4">B</tspan></text>
    <text class="kecil" x="145" y="300" text-anchor="middle">arah putar sama</text>
  </g>

  <!-- ===== 3. Bersinggungan ===== -->
  <g transform="translate(640,4)">
    <rect class="bayang" x="6" y="6" width="290" height="310"/>
    <rect class="panel" x="0" y="0" width="290" height="310"/>
    <rect class="kepala" x="0" y="0" width="290" height="42"/>
    <text class="judul" x="16" y="27">3. Bersinggungan</text>

    <circle class="roda" cx="90" cy="175" r="40"/>
    <circle class="roda" cx="195" cy="175" r="65"/>
    <circle class="pusat" cx="90" cy="175" r="4"/>
    <circle class="pusat" cx="195" cy="175" r="4"/>
    <path class="putar" d="M45,149 A52,52 0 0 1 116,130" marker-end="url(#panah-o)"/>
    <path class="putar" d="M233.5,108.3 A77,77 0 0 0 156.5,108.3" marker-end="url(#panah-o)"/>
    <text class="label" x="90" y="206" text-anchor="middle">A</text>
    <text class="label" x="195" y="215" text-anchor="middle">B</text>

    <text class="label" x="145" y="282" text-anchor="middle">v<tspan font-size="11" dy="4">A</tspan><tspan dy="-4"> = v</tspan><tspan font-size="11" dy="4">B</tspan></text>
    <text class="kecil" x="145" y="300" text-anchor="middle">arah putar berlawanan</text>
  </g>
</svg>
