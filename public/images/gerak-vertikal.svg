<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-label="Diagram gerak vertikal ke atas: benda dilempar dengan kecepatan awal v0, melambat karena gravitasi, kecepatannya nol di ketinggian maksimum, lalu jatuh kembali">
  <defs>
    <style>
      .label { font: 700 16px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .kecil { font: 500 13px Inter, Arial, sans-serif; fill: #475569; }
      .bola { fill: #FF6B00; stroke: #1A1A1A; stroke-width: 2.5; }
      .lintasan { stroke: #475569; stroke-width: 2; stroke-dasharray: 6 5; fill: none; }
      .vektor { stroke: #1A1A1A; stroke-width: 3.5; fill: none; }
      .gravitasi { stroke: #1A1A1A; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
      .ukuran { stroke: #1A1A1A; stroke-width: 2; fill: none; }
      .bantu { stroke: #1A1A1A; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
      .tanah { fill: #C5FA00; stroke: #1A1A1A; stroke-width: 3; }
    </style>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
    <pattern id="arsir" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#1A1A1A" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Tanah -->
  <rect class="tanah" x="40" y="390" width="480" height="16"/>
  <rect x="40" y="390" width="480" height="16" fill="url(#arsir)"/>

  <!-- Ketinggian maksimum -->
  <path class="bantu" d="M120,85 H286"/>
  <path class="ukuran" d="M120,380 V95" marker-start="url(#panah)" marker-end="url(#panah)"/>
  <text class="label" x="108" y="245" text-anchor="end">h<tspan font-size="11" dy="4">maks</tspan></text>

  <!-- Lintasan: naik di kiri, turun di kanan -->
  <path class="lintasan" d="M250,377 V130 Q250,85 300,85 Q350,85 350,130 V377"/>

  <!-- Puncak: kecepatan nol -->
  <circle class="bola" cx="300" cy="85" r="13"/>
  <text class="label" x="300" y="58" text-anchor="middle">v<tspan font-size="11" dy="4">t</tspan><tspan dy="-4"> = 0</tspan></text>

  <!-- Saat naik: kecepatan mengecil -->
  <circle class="bola" cx="250" cy="376" r="13"/>
  <path class="vektor" d="M250,358 V282" marker-end="url(#panah)"/>
  <text class="label" x="236" y="326" text-anchor="end">v<tspan font-size="11" dy="4">0</tspan></text>

  <circle class="bola" cx="250" cy="220" r="13"/>
  <path class="vektor" d="M250,202 V168" marker-end="url(#panah)"/>
  <text class="label" x="236" y="192" text-anchor="end">v<tspan font-size="11" dy="4">t</tspan></text>
  <text class="kecil" x="228" y="214" text-anchor="end">naik</text>

  <!-- Saat turun -->
  <circle class="bola" cx="350" cy="220" r="13"/>
  <path class="vektor" d="M350,238 V280" marker-end="url(#panah)"/>
  <text class="label" x="364" y="266">v<tspan font-size="11" dy="4">t</tspan></text>
  <text class="kecil" x="372" y="214">turun</text>

  <!-- Gravitasi selalu ke bawah -->
  <path class="gravitasi" d="M190,110 V170" marker-end="url(#panah)"/>
  <text class="label" x="190" y="192" text-anchor="middle">g</text>
  <path class="gravitasi" d="M430,110 V170" marker-end="url(#panah)"/>
  <text class="label" x="430" y="192" text-anchor="middle">g</text>

  <text class="kecil" x="250" y="428" text-anchor="middle">t = 0</text>
</svg>
