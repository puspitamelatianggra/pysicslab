<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 225" role="img" aria-label="Tiga grafik hukum gas. Hukum Boyle pada suhu tetap: grafik tekanan P terhadap volume V berbentuk hiperbola, dan kurva untuk suhu T2 yang lebih tinggi berada lebih jauh dari sumbu. Hukum Charles pada tekanan tetap: grafik volume V terhadap suhu mutlak T berupa garis lurus yang jika diperpanjang melalui titik nol kelvin. Hukum Gay-Lussac pada volume tetap: grafik tekanan P terhadap suhu mutlak T juga berupa garis lurus melalui titik nol">
