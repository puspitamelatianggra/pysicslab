<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" role="img" aria-label="Lingkaran berpusat O dengan jari-jari r dan titik P di luar lingkaran. Dari P ditarik dua garis singgung yang menyinggung lingkaran di A dan B. Jari-jari OA tegak lurus PA dan jari-jari OB tegak lurus PB, sehingga segitiga OAP dan OBP siku-siku. Panjang PA sama dengan PB.">
