<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" role="img" aria-label="Grafik intensitas radiasi benda hitam terhadap panjang gelombang untuk suhu 6.000 K, 5.000 K, dan 4.000 K. Setiap kurva naik ke satu puncak lalu turun. Makin tinggi suhu, puncaknya makin tinggi dan bergeser ke panjang gelombang yang lebih pendek, sesuai hukum pergeseran Wien. Kurva putus-putus menurut teori klasik Rayleigh-Jeans terus naik tanpa batas di panjang gelombang pendek, yang disebut bencana ultraungu">
