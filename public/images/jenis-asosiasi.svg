<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-label="Tiga diagram pencar. Kiri, asosiasi positif: titik-titik mengumpul di sekitar garis yang naik. Tengah, asosiasi negatif: titik-titik mengumpul di sekitar garis yang turun. Kanan, tidak ada asosiasi: titik-titik tersebar acak tanpa pola.">
