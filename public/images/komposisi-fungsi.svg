<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" role="img" aria-label="Diagram panah komposisi fungsi. Himpunan A berisi 1, 2, 3 dipetakan oleh f(x) = x + 1 ke himpunan B berisi 2, 3, 4, lalu dipetakan oleh g(x) = 2x ke himpunan C berisi 4, 6, 8. Panah besar dari A langsung ke C menunjukkan fungsi komposisi g bundaran f, yaitu 2x + 2.">
  <defs>
    <style>
      .bayang { fill: #1A1A1A; }
      .panel { fill: #FFFFFF; stroke: #1A1A1A; stroke-width: 3; }
      .kepala { fill: #C5FA00; stroke: #1A1A1A; stroke-width: 3; }
      .judul { font: 700 16px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .label { font: 700 15px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .besar { font: 700 22px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .angka { font: 600 13px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .kecil { font: 500 13px Arial, sans-serif; fill: #475569; }
      .sumbu { stroke: #1A1A1A; stroke-width: 2; fill: none; }
      .kisi { stroke: #E2E2E2; stroke-width: 1; fill: none; }
      .grafik { stroke: #FF6B00; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .grafik2 { stroke: #1A1A1A; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .putus { stroke: #1A1A1A; stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; }
      .bantu { stroke: #1A1A1A; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .garis { stroke: #1A1A1A; stroke-width: 2.5; fill: none; stroke-linejoin: round; }
      .tebal { stroke: #FF6B00; stroke-width: 6; fill: none; stroke-linecap: round; }
      .isi-lime { fill: #C5FA00; stroke: #1A1A1A; stroke-width: 2.5; }
      .isi-oranye { fill: #FF6B00; stroke: #1A1A1A; stroke-width: 2.5; }
      .isi-krem { fill: #FFE8D6; stroke: #1A1A1A; stroke-width: 2.5; }
      .isi-putih { fill: #FFFFFF; stroke: #1A1A1A; stroke-width: 2.5; }
      .daerah { fill: #C5FA00; opacity: 0.75; }
      .titik { fill: #FF6B00; stroke: #1A1A1A; stroke-width: 2; }
      .titik-hitam { fill: #1A1A1A; }
    </style>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="panah-oranye" viewBox="0 0 10 10" refX="7" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF6B00" stroke="#1A1A1A" stroke-width="1.2"/>
    </marker>
  </defs>
    <ellipse class="isi-putih" cx="110" cy="200" rx="56" ry="92"/>
    <text class="label" x="110" y="318" text-anchor="middle">A</text>
    <circle class="titik-hitam" cx="96" cy="140" r="4"/>
    <text class="label" x="114" y="145">1</text>
    <circle class="titik-hitam" cx="96" cy="200" r="4"/>
    <text class="label" x="114" y="205">2</text>
    <circle class="titik-hitam" cx="96" cy="260" r="4"/>
    <text class="label" x="114" y="265">3</text>
    <ellipse class="isi-putih" cx="320" cy="200" rx="56" ry="92"/>
    <text class="label" x="320" y="318" text-anchor="middle">B</text>
    <circle class="titik-hitam" cx="306" cy="140" r="4"/>
    <text class="label" x="324" y="145">2</text>
    <circle class="titik-hitam" cx="306" cy="200" r="4"/>
    <text class="label" x="324" y="205">3</text>
    <circle class="titik-hitam" cx="306" cy="260" r="4"/>
    <text class="label" x="324" y="265">4</text>
    <ellipse class="isi-putih" cx="530" cy="200" rx="56" ry="92"/>
    <text class="label" x="530" y="318" text-anchor="middle">C</text>
    <circle class="titik-hitam" cx="516" cy="140" r="4"/>
    <text class="label" x="534" y="145">4</text>
    <circle class="titik-hitam" cx="516" cy="200" r="4"/>
    <text class="label" x="534" y="205">6</text>
    <circle class="titik-hitam" cx="516" cy="260" r="4"/>
    <text class="label" x="534" y="265">8</text>
    <path class="garis" d="M132,140 L298,140" marker-end="url(#panah)"/>
    <path class="garis" d="M342,140 L508,140" marker-end="url(#panah)"/>
    <path class="garis" d="M132,200 L298,200" marker-end="url(#panah)"/>
    <path class="garis" d="M342,200 L508,200" marker-end="url(#panah)"/>
    <path class="garis" d="M132,260 L298,260" marker-end="url(#panah)"/>
    <path class="garis" d="M342,260 L508,260" marker-end="url(#panah)"/>
    <rect class="isi-lime" x="160" y="72" width="110" height="28" rx="4"/>
    <text class="angka" x="215" y="91" text-anchor="middle">f(x) = x + 1</text>
    <rect class="isi-lime" x="372" y="72" width="106" height="28" rx="4"/>
    <text class="angka" x="425" y="91" text-anchor="middle">g(x) = 2x</text>
    <path class="tebal" d="M110,96 Q320,-6 524,92" marker-end="url(#panah-oranye)"/>
    <rect class="isi-krem" x="215" y="28" width="210" height="30" rx="4"/>
    <text class="label" x="320" y="49" text-anchor="middle">(g ∘ f)(x) = 2x + 2</text>
</svg>
