<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Kawat dengan luas penampang A dan panjang awal l digantung pada atap. Setelah ujung bawahnya ditarik gaya F, panjang kawat bertambah sebesar delta l">
  <defs>
    <style>
      .label { font: 700 16px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .judul { font: 600 14px "Space Grotesk", Arial, sans-serif; fill: #475569; }
      .vektor { stroke: #1A1A1A; stroke-width: 3.5; fill: none; }
      .atap { fill: #C5FA00; stroke: #1A1A1A; stroke-width: 3; }
      .batang { fill: #FFF7ED; stroke: #1A1A1A; stroke-width: 2.5; }
      .penampang { fill: #FF6B00; stroke: #1A1A1A; stroke-width: 2; }
      .ukur { stroke: #1A1A1A; stroke-width: 1.5; fill: none; }
      .bantu { stroke: #1A1A1A; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
      .bertambah { fill: #FF6B00; fill-opacity: 0.35; }
    </style>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <text class="judul" x="135" y="26" text-anchor="middle">Sebelum ditarik</text>
  <text class="judul" x="345" y="26" text-anchor="middle">Sesudah ditarik</text>

  <rect class="atap" x="40" y="40" width="440" height="20"/>

  <!-- ===== Sebelum ===== -->
  <rect class="batang" x="120" y="60" width="30" height="160"/>
  <ellipse class="penampang" cx="135" cy="220" rx="15" ry="5"/>
  <path class="ukur" d="M100,62 V218" marker-start="url(#panah)" marker-end="url(#panah)"/>
  <text class="label" x="92" y="145" text-anchor="end">l</text>
  <path class="ukur" d="M152,224 L180,244"/>
  <text class="label" x="184" y="254">A</text>

  <!-- ===== Sesudah ===== -->
  <rect class="batang" x="330" y="60" width="30" height="190"/>
  <rect class="bertambah" x="330" y="220" width="30" height="30"/>
  <path class="bantu" d="M300,220 H385"/>
  <path class="ukur" d="M310,62 V218" marker-start="url(#panah)" marker-end="url(#panah)"/>
  <text class="label" x="302" y="145" text-anchor="end">l</text>
  <path class="ukur" d="M385,222 V248" marker-start="url(#panah)" marker-end="url(#panah)"/>
  <text class="label" x="393" y="241">Δl</text>
  <path class="vektor" d="M345,250 V292" marker-end="url(#panah)"/>
  <text class="label" x="355" y="286">F</text>
</svg>
