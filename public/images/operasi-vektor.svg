    <polygon points="233.8,99.1 217.7,103.1 226.5,113.9" fill="#C5FA00" stroke="#1A1A1A" stroke-width="1.5" stroke-linejoin="round"/>
    <text class="besar" x="120.6" y="243.2" text-anchor="middle">a</text>
    <text class="besar" x="225.1" y="153.9">b</text>
    <text class="label" x="133.2" y="166.3" text-anchor="end">a + b</text>
    <text class="kecil" x="150" y="300" text-anchor="middle">ujung a disambung pangkal b</text>
  </g>
  <g transform="translate(322,4)">
    <rect class="bayang" x="6" y="6" width="300" height="316"/>
    <rect class="panel" x="0" y="0" width="300" height="316"/>
    <rect class="kepala" x="0" y="0" width="300" height="42"/>
    <text class="judul" x="16" y="27">Aturan jajargenjang</text>
    <path class="bantu" d="M188.5,196.7 L233.8,99.1 L97.9,147.9"/>
    <path d="M52.6,245.6 L174.4,201.8" stroke="#FF6B00" stroke-width="4" fill="none" stroke-linecap="round"/>
    <polygon points="188.5,196.7 172,195.2 176.7,208.4" fill="#FF6B00" stroke="#1A1A1A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M52.6,245.6 L91.6,161.5" stroke="#1A1A1A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <polygon points="97.9,147.9 85.3,158.6 98,164.5" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M52.6,245.6 L222.1,108.5" stroke="#1A1A1A" stroke-width="8.5" fill="none" stroke-linecap="round"/>
    <path d="M52.6,245.6 L222.1,108.5" stroke="#C5FA00" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <polygon points="233.8,99.1 217.7,103.1 226.5,113.9" fill="#C5FA00" stroke="#1A1A1A" stroke-width="1.5" stroke-linejoin="round"/>
    <text class="besar" x="120.6" y="243.2" text-anchor="middle">a</text>
    <text class="besar" x="63.3" y="196.7" text-anchor="end">b</text>
    <text class="label" x="229.8" y="87.1" text-anchor="middle">a + b</text>
    <text class="kecil" x="150" y="300" text-anchor="middle">pangkal a dan b berimpit</text>
  </g>
  <g transform="translate(640,4)">
    <rect class="bayang" x="6" y="6" width="300" height="316"/>
    <rect class="panel" x="0" y="0" width="300" height="316"/>
    <rect class="kepala" x="0" y="0" width="300" height="42"/>
    <text class="judul" x="16" y="27">Pengurangan a − b</text>
    <path d="M52.6,245.6 L174.4,201.8" stroke="#FF6B00" stroke-width="4" fill="none" stroke-linecap="round"/>
    <polygon points="188.5,196.7 172,195.2 176.7,208.4" fill="#FF6B00" stroke="#1A1A1A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M52.6,245.6 L91.6,161.5" stroke="#1A1A1A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <polygon points="97.9,147.9 85.3,158.6 98,164.5" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M97.9,147.9 L175.3,189.6" stroke="#1A1A1A" stroke-width="8.5" fill="none" stroke-linecap="round"/>
    <path d="M97.9,147.9 L175.3,189.6" stroke="#C5FA00" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <polygon points="188.5,196.7 178.6,183.5 172,195.8" fill="#C5FA00" stroke="#1A1A1A" stroke-width="1.5" stroke-linejoin="round"/>
    <text class="besar" x="126.6" y="245.2" text-anchor="middle">a</text>
    <text class="besar" x="63.3" y="196.7" text-anchor="end">b</text>
    <text class="label" x="153.2" y="162.3">a − b</text>
    <text class="kecil" x="150" y="300" text-anchor="middle">dari ujung b ke ujung a</text>
  </g>

</svg>
