    <text class="angka" x="91.5" y="301.6" text-anchor="end">O</text>
    <path class="bantu" d="M340.9,285.6 V118.9"/>
    <path class="tebal" d="M98.5,285.6 H340.9" stroke="#1A1A1A" stroke-width="3" opacity="0.35"/>
