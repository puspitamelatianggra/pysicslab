    <text class="label" x="350.9" y="112.9">A(4, 3)</text>
    <text class="angka" x="219.7" y="319.6" text-anchor="middle">komponen x = 4</text>
    <text class="angka" x="350.9" y="202.2">komponen y = 3</text>
    <text class="besar" x="185.5" y="184.7" text-anchor="end">a</text>
    <text class="label" x="237.9" y="52.2" text-anchor="middle">|a| = √(4² + 3²) = 5</text>
</svg>
