<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 370" role="img" aria-label="Vektor a digambar sebagai panah dari titik asal O ke titik A(4, 3). Komponen mendatarnya 4 dan komponen tegaknya 3, ditunjukkan garis putus-putus. Panjang vektor a sama dengan akar dari 4 kuadrat ditambah 3 kuadrat, yaitu 5.">
  <defs>
    <style>
      .bayang { fill: #1A1A1A; }
      .panel { fill: #FFFFFF; stroke: #1A1A1A; stroke-width: 3; }
      .kepala { fill: #C5FA00; stroke: #1A1A1A; stroke-width: 3; }
