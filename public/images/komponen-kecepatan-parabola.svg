<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" role="img" aria-label="Penguraian kecepatan awal v0 yang membentuk sudut elevasi theta menjadi komponen mendatar v0 cos theta dan komponen vertikal v0 sin theta">
  <defs>
    <style>
      .label { font: 700 16px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .vektor { stroke: #1A1A1A; stroke-width: 3.5; fill: none; }
      .komponen { stroke: #FF6B00; stroke-width: 3.5; fill: none; }
      .bantu { stroke: #1A1A1A; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
      .busur { stroke: #1A1A1A; stroke-width: 2; fill: none; }
    </style>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="panah-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF6B00"/>
    </marker>
  </defs>

  <path class="bantu" d="M280,90 V240 M280,90 H80"/>
  <path class="komponen" d="M80,240 H278" marker-end="url(#panah-o)"/>
  <path class="komponen" d="M80,240 V92" marker-end="url(#panah-o)"/>
  <path class="vektor" d="M80,240 L278,91.5" marker-end="url(#panah)"/>

  <path class="busur" d="M125,240 A45,45 0 0 0 116,213"/>
  <text class="label" x="132" y="230">θ</text>

  <text class="label" x="162" y="152">v<tspan font-size="11" dy="4">0</tspan></text>
  <text class="label" x="180" y="268" text-anchor="middle">v<tspan font-size="11" dy="4">0x</tspan><tspan dy="-4"> = v</tspan><tspan font-size="11" dy="4">0</tspan><tspan dy="-4"> cos θ</tspan></text>
  <text class="label" x="80" y="72" text-anchor="middle">v<tspan font-size="11" dy="4">0y</tspan><tspan dy="-4"> = v</tspan><tspan font-size="11" dy="4">0</tspan><tspan dy="-4"> sin θ</tspan></text>
</svg>
