  <circle cx="130" cy="100" r="18" fill="#C5FA00" stroke="#1A1A1A" stroke-width="2.5"/>
  <path d="M117,87 L143,113 M117,113 L143,87" stroke="#1A1A1A" stroke-width="2.5"/>
  <circle cx="205" cy="100" r="18" fill="#E9FBB0" stroke="#1A1A1A" stroke-width="2.5"/>
  <path d="M192,87 L218,113 M192,113 L218,87" stroke="#1A1A1A" stroke-width="2.5"/>
  <circle cx="280" cy="100" r="18" fill="#F6FDDD" stroke="#1A1A1A" stroke-width="2.5"/>
  <path d="M267,87 L293,113 M267,113 L293,87" stroke="#1A1A1A" stroke-width="2.5"/>
