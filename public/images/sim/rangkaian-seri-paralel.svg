  <path d="M26,100 H54" stroke="#1A1A1A" stroke-width="2.5"/>
  <path d="M34,88 H46 M40,82 V94" stroke="#1A1A1A" stroke-width="3"/>
  <path d="M34,112 H46" stroke="#1A1A1A" stroke-width="3"/>
