    <circle cx="130" cy="60" r="4"/><circle cx="130" cy="140" r="4"/>
    <circle cx="205" cy="62" r="4"/><circle cx="205" cy="82" r="4"/><circle cx="205" cy="138" r="4"/>
    <circle cx="280" cy="64" r="4"/>
    <circle cx="90" cy="160" r="4"/><circle cx="170" cy="160" r="4"/>
