<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Partikel alfa dari kiri dibelokkan oleh inti bermuatan, satu lintasan terpantul hampir balik">
  <rect width="320" height="200" fill="#FFFFFF"/>
  <!-- kisi sebagai penggaris -->
  <g stroke="#DDD8CF" stroke-width="1">
    <path d="M40,20 V180 M100,20 V180 M160,20 V180 M220,20 V180 M280,20 V180"/>
    <path d="M20,40 H300 M20,100 H300 M20,160 H300"/>
  </g>
  <!-- garis tembak -->
  <path d="M20,100 H150" stroke="#475569" stroke-width="2" stroke-dasharray="5 5"/>
  <!-- lintasan lama -->
  <path d="M20,60 Q130,60 200,22" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M20,140 Q130,140 200,178" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M20,76 Q110,70 140,42 Q170,30 235,30" fill="none" stroke="#475569" stroke-width="2"/>
  <!-- lintasan sekarang: hampir lurus ke inti lalu memantul balik -->
  <path d="M20,112 Q120,112 160,104 Q175,100 160,86 Q130,60 60,50" fill="none" stroke="#1A1A1A" stroke-width="3.5"/>
  <circle cx="60" cy="50" r="7" fill="#C5FA00" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- garis b -->
  <path d="M168,100 V112" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="3 3"/>
  <!-- inti -->
  <circle cx="168" cy="100" r="14" fill="#FF6B00" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- berkas alfa dari kiri -->
  <circle cx="26" cy="112" r="7" fill="#C5FA00" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="236" y="162" width="52" height="18" fill="#C5FA00" stroke="#1A1A1A" stroke-width="2"/>
</svg>
