<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 320" width="100%" height="100%" style="background: #ffffff; font-family: &#39;Inter&#39;, system-ui, sans-serif; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); padding: 16px;">
    
    <!-- STYLING CSS INTERNAL -->
    <style>
        .card-bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; rx: 8px; }
        .axis { stroke: #64748b; stroke-width: 1.5; stroke-linecap: round; }
        .grid-line { stroke: #e2e8f0; stroke-width: 0.8; stroke-dasharray: 4 4; }
        .label-title { font-size: 14px; font-weight: 700; fill: #1e293b; }
        .label-sub { font-size: 11px; fill: #64748b; }
        .axis-text { font-size: 10px; fill: #64748b; }
        
        /* Warna Garis Grafik */
        .line-s { stroke: #2563eb; stroke-width: 3; fill: none; stroke-linecap: round; }
        .line-v { stroke: #16a34a; stroke-width: 3; fill: none; stroke-linecap: round; }
        .line-a { stroke: #dc2626; stroke-width: 3; fill: none; stroke-linecap: round; }
        .dot { fill: #ffffff; stroke-width: 2.5; }
    </style>

    <!-- ================= 1. GRAFIK S - T ================= -->
    <g transform="translate(10, 10)">
        <!-- Card Background -->
        <rect class="card-bg" x="0" y="0" width="300" height="290" />
        
        <!-- Judul Grafik -->
        <text x="20" y="30" class="label-title">Grafik Posisi (s vs t)</text>
        <text x="20" y="48" class="label-sub">Linear naik (v konstan / positif)</text>
        
        <!-- Sumbu & Grid -->
        <line x1="45" y1="230" x2="270" y2="230" class="axis" /> <!-- Sumbu X -->
        <line x1="45" y1="70" x2="45" y2="245" class="axis" />  <!-- Sumbu Y -->
        <line x1="45" y1="150" x2="270" y2="150" class="grid-line" />
        
        <text x="255" y="248" class="axis-text">t (s)</text>
        <text x="22" y="75" class="axis-text">s (m)</text>

        <!-- Kurva Grafik s-t (Miring ke atas) -->
        <path d="M 45 220 L 250 90" class="line-s" />
        <circle cx="45" cy="220" r="4" class="dot" style="stroke: #2563eb;" />
        <circle cx="250" cy="90" r="4" class="dot" style="stroke: #2563eb;" />
    </g>

    <!-- ================= 2. GRAFIK V - T ================= -->
    <g transform="translate(325, 10)">
        <!-- Card Background -->
        <rect class="card-bg" x="0" y="0" width="300" height="290" />
        
        <!-- Judul Grafik -->
        <text x="20" y="30" class="label-title">Grafik Kecepatan (v vs t)</text>
        <text x="20" y="48" class="label-sub">Konstan / Garis lurus mendatar</text>
        
        <!-- Sumbu & Grid -->
        <line x1="45" y1="230" x2="270" y2="230" class="axis" />
        <line x1="45" y1="70" x2="45" y2="245" class="axis" />
        <line x1="45" y1="140" x2="270" y2="140" class="grid-line" />
        
        <text x="255" y="248" class="axis-text">t (s)</text>
        <text x="20" y="75" class="axis-text">v (m/s)</text>

        <!-- Kurva Grafik v-t (Mendatar) -->
        <path d="M 45 140 L 250 140" class="line-v" />
        <circle cx="45" cy="140" r="4" class="dot" style="stroke: #16a34a;" />
        <circle cx="250" cy="140" r="4" class="dot" style="stroke: #16a34a;" />
    </g>

    <!-- ================= 3. GRAFIK A - T ================= -->
    <g transform="translate(640, 10)">
        <!-- Card Background -->
        <rect class="card-bg" x="0" y="0" width="300" height="290" />
        
        <!-- Judul Grafik -->
        <text x="20" y="30" class="label-title">Grafik Percepatan (a vs t)</text>
        <text x="20" y="48" class="label-sub">Nol (a = 0 sepanjang sumbu t)</text>
        
        <!-- Sumbu & Grid -->
        <line x1="45" y1="230" x2="270" y2="230" class="axis" />
        <line x1="45" y1="70" x2="45" y2="245" class="axis" />
        
        <text x="255" y="248" class="axis-text">t (s)</text>
        <text x="18" y="75" class="axis-text">a (m/s²)</text>

        <!-- Kurva Grafik a-t (Berimpit di sumbu nol / bawah) -->
        <path d="M 45 230 L 250 230" class="line-a" />
        <circle cx="45" cy="230" r="4" class="dot" style="stroke: #dc2626;" />
        <circle cx="250" cy="230" r="4" class="dot" style="stroke: #dc2626;" />
    </g>

</svg>