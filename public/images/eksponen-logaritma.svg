<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" role="img" aria-label="Dua garis bilangan yang sejajar. Garis atas berisi 1, 2, 4, 8, 16, 32, dan setiap langkah ke kanan dikali 2. Garis bawah berisi pangkatnya, yaitu 0, 1, 2, 3, 4, 5. Logaritma basis 2 dari bilangan di atas adalah bilangan di bawahnya, misalnya 2 pangkat 3 sama dengan 8 setara dengan logaritma basis 2 dari 8 sama dengan 3.">
  <defs>
    <style>
      .bayang { fill: #1A1A1A; }
      .panel { fill: #FFFFFF; stroke: #1A1A1A; stroke-width: 3; }
      .kepala { fill: #C5FA00; stroke: #1A1A1A; stroke-width: 3; }
      .judul { font: 700 16px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .label { font: 700 15px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .besar { font: 700 22px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .angka { font: 600 13px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .kecil { font: 500 13px Arial, sans-serif; fill: #475569; }
      .sumbu { stroke: #1A1A1A; stroke-width: 2; fill: none; }
      .kisi { stroke: #E2E2E2; stroke-width: 1; fill: none; }
      .grafik { stroke: #FF6B00; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .grafik2 { stroke: #1A1A1A; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .putus { stroke: #1A1A1A; stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; }
      .bantu { stroke: #1A1A1A; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .garis { stroke: #1A1A1A; stroke-width: 2.5; fill: none; stroke-linejoin: round; }
      .tebal { stroke: #FF6B00; stroke-width: 6; fill: none; stroke-linecap: round; }
      .isi-lime { fill: #C5FA00; stroke: #1A1A1A; stroke-width: 2.5; }
      .isi-oranye { fill: #FF6B00; stroke: #1A1A1A; stroke-width: 2.5; }
      .isi-krem { fill: #FFE8D6; stroke: #1A1A1A; stroke-width: 2.5; }
      .isi-putih { fill: #FFFFFF; stroke: #1A1A1A; stroke-width: 2.5; }
      .daerah { fill: #C5FA00; opacity: 0.75; }
      .titik { fill: #FF6B00; stroke: #1A1A1A; stroke-width: 2; }
      .titik-hitam { fill: #1A1A1A; }
    </style>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="panah-oranye" viewBox="0 0 10 10" refX="7" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF6B00" stroke="#1A1A1A" stroke-width="1.2"/>
    </marker>
  </defs>
    <text class="judul" x="20" y="24">Bilangan 2<tspan font-size="11" dy="-7">n</tspan></text>
    <rect class="isi-lime" x="44" y="70" width="52" height="38" rx="4"/>
    <text class="label" x="70" y="95" text-anchor="middle">1</text>
    <path class="garis" d="M92,62 Q116,40 140,62" marker-end="url(#panah)"/>
    <text class="angka" x="116" y="42" text-anchor="middle">×2</text>
    <rect class="isi-lime" x="136" y="70" width="52" height="38" rx="4"/>
    <text class="label" x="162" y="95" text-anchor="middle">2</text>
    <path class="garis" d="M184,62 Q208,40 232,62" marker-end="url(#panah)"/>
    <text class="angka" x="208" y="42" text-anchor="middle">×2</text>
    <rect class="isi-lime" x="228" y="70" width="52" height="38" rx="4"/>
    <text class="label" x="254" y="95" text-anchor="middle">4</text>
    <path class="garis" d="M276,62 Q300,40 324,62" marker-end="url(#panah)"/>
    <text class="angka" x="300" y="42" text-anchor="middle">×2</text>
    <rect class="isi-lime" x="320" y="70" width="52" height="38" rx="4"/>
    <text class="label" x="346" y="95" text-anchor="middle">8</text>
    <path class="garis" d="M368,62 Q392,40 416,62" marker-end="url(#panah)"/>
    <text class="angka" x="392" y="42" text-anchor="middle">×2</text>
    <rect class="isi-lime" x="412" y="70" width="52" height="38" rx="4"/>
    <text class="label" x="438" y="95" text-anchor="middle">16</text>
    <path class="garis" d="M460,62 Q484,40 508,62" marker-end="url(#panah)"/>
    <text class="angka" x="484" y="42" text-anchor="middle">×2</text>
    <rect class="isi-lime" x="504" y="70" width="52" height="38" rx="4"/>
    <text class="label" x="530" y="95" text-anchor="middle">32</text>
    <path class="bantu" d="M70,110 V186"/>
    <path class="bantu" d="M162,110 V186"/>
    <path class="bantu" d="M254,110 V186"/>
    <path class="bantu" d="M346,110 V186"/>
    <path class="bantu" d="M438,110 V186"/>
    <path class="bantu" d="M530,110 V186"/>
    <rect class="isi-putih" x="44" y="190" width="52" height="38" rx="4"/>
    <text class="label" x="70" y="215" text-anchor="middle">0</text>
    <rect class="isi-putih" x="136" y="190" width="52" height="38" rx="4"/>
    <text class="label" x="162" y="215" text-anchor="middle">1</text>
    <rect class="isi-putih" x="228" y="190" width="52" height="38" rx="4"/>
    <text class="label" x="254" y="215" text-anchor="middle">2</text>
    <rect class="isi-putih" x="320" y="190" width="52" height="38" rx="4"/>
    <text class="label" x="346" y="215" text-anchor="middle">3</text>
    <rect class="isi-putih" x="412" y="190" width="52" height="38" rx="4"/>
    <text class="label" x="438" y="215" text-anchor="middle">4</text>
    <rect class="isi-putih" x="504" y="190" width="52" height="38" rx="4"/>
    <text class="label" x="530" y="215" text-anchor="middle">5</text>
    <text class="judul" x="20" y="256">Pangkat n = <tspan font-size="11" dy="-7">2</tspan><tspan dy="7">log (bilangan di atasnya)</tspan></text>
    <rect class="isi-krem" x="170" y="276" width="280" height="40" rx="5"/>
    <text class="label" x="310" y="302" text-anchor="middle">2³ = 8  ⇔  <tspan font-size="11" dy="-7">2</tspan><tspan dy="7">log 8 = 3</tspan></text>
</svg>
