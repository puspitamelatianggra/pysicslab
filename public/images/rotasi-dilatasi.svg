<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 334" role="img" aria-label="Dua panel transformasi. Kiri, rotasi 90 derajat berlawanan arah jarum jam terhadap titik asal O memutar segitiga A(1, 1), B(3, 1), C(1, 3) menjadi A′(−1, 1), B′(−1, 3), C′(−3, 1); setiap titik (x, y) menjadi (−y, x). Kanan, dilatasi dengan pusat O dan faktor 2 memperbesar segitiga A(1, 1), B(2, 1), C(1, 2) menjadi A′(2, 2), B′(4, 2), C′(2, 4); garis putus-putus dari O melalui setiap titik menunjukkan jaraknya menjadi dua kali.">
  <defs>
    <style>
      .bayang { fill: #1A1A1A; }
      .panel { fill: #FFFFFF; stroke: #1A1A1A; stroke-width: 3; }
      .kepala { fill: #C5FA00; stroke: #1A1A1A; stroke-width: 3; }
      .judul { font: 700 16px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .label { font: 700 15px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .besar { font: 700 22px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .angka { font: 600 13px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .kecil { font: 500 13px Arial, sans-serif; fill: #475569; }
      .sumbu { stroke: #1A1A1A; stroke-width: 2; fill: none; }
      .kisi { stroke: #E2E2E2; stroke-width: 1; fill: none; }
      .grafik { stroke: #FF6B00; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .grafik2 { stroke: #1A1A1A; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .putus { stroke: #1A1A1A; stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; }
      .bantu { stroke: #1A1A1A; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .garis { stroke: #1A1A1A; stroke-width: 2.5; fill: none; stroke-linejoin: round; }
      .tebal { stroke: #FF6B00; stroke-width: 6; fill: none; stroke-linecap: round; }
      .isi-lime { fill: #C5FA00; stroke: #1A1A1A; stroke-width: 2.5; }
      .isi-oranye { fill: #FF6B00; stroke: #1A1A1A; stroke-width: 2.5; }
      .isi-krem { fill: #FFE8D6; stroke: #1A1A1A; stroke-width: 2.5; }
      .isi-putih { fill: #FFFFFF; stroke: #1A1A1A; stroke-width: 2.5; }
      .daerah { fill: #C5FA00; opacity: 0.75; }
      .titik { fill: #FF6B00; stroke: #1A1A1A; stroke-width: 2; }
      .titik-hitam { fill: #1A1A1A; }
    </style>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="panah-oranye" viewBox="0 0 10 10" refX="7" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF6B00" stroke="#1A1A1A" stroke-width="1.2"/>
    </marker>
  </defs>
  <g transform="translate(4,4)">
    <rect class="bayang" x="6" y="6" width="310" height="320"/>
    <rect class="panel" x="0" y="0" width="310" height="320"/>
    <rect class="kepala" x="0" y="0" width="310" height="42"/>
    <text class="judul" x="16" y="27">Rotasi 90° terhadap O</text>
    <path class="kisi" d="M36,60 V280 M65.7,60 V280 M95.5,60 V280 M125.2,60 V280 M184.8,60 V280 M214.5,60 V280 M244.3,60 V280 M274,60 V280 M30,197.5 H280 M30,151.7 H280 M30,105.8 H280 M30,60 H280"/>
    <path class="sumbu" d="M30,243.3 H292" marker-end="url(#panah)"/>
    <path class="sumbu" d="M155,280 V48" marker-end="url(#panah)"/>
    <text class="label" x="288" y="263.3" text-anchor="end">x</text>
    <text class="label" x="164" y="58">y</text>
    <text class="angka" x="148" y="259.3" text-anchor="end">O</text>
    <polygon class="isi-lime" points="184.8,197.5 244.3,197.5 184.8,105.8" stroke-linejoin="round"/>
    <text class="angka" x="192.8" y="215.5" text-anchor="middle">A</text>
    <text class="angka" x="254.3" y="213.5" text-anchor="middle">B</text>
    <text class="angka" x="194.8" y="101.8" text-anchor="middle">C</text>
    <polygon class="isi-oranye" points="125.2,197.5 125.2,105.8 65.7,197.5" stroke-linejoin="round"/>
    <text class="angka" x="117.2" y="215.5" text-anchor="middle">A′</text>
    <text class="angka" x="113.2" y="99.8" text-anchor="middle">B′</text>
    <text class="angka" x="53.7" y="213.5" text-anchor="middle">C′</text>
    <path class="garis" d="M260.9,189 A111.6,171.9 0 0 0 119.7,80.3" stroke-dasharray="5 4" marker-end="url(#panah)"/>
    <text class="label" x="220.5" y="82.9">90°</text>    <text class="kecil" x="155" y="306" text-anchor="middle">90° berlawanan arah jarum jam: (x, y) → (−y, x)</text>
  </g>
  <g transform="translate(336,4)">
    <rect class="bayang" x="6" y="6" width="310" height="320"/>
    <rect class="panel" x="0" y="0" width="310" height="320"/>
    <rect class="kepala" x="0" y="0" width="310" height="42"/>
    <text class="judul" x="16" y="27">Dilatasi [O, 2]</text>
    <path class="kisi" d="M105,60 V280 M146.7,60 V280 M188.3,60 V280 M230,60 V280 M271.7,60 V280 M30,211.7 H280 M30,173.8 H280 M30,135.9 H280 M30,97.9 H280 M30,60 H280"/>
    <path class="sumbu" d="M30,249.7 H292" marker-end="url(#panah)"/>
    <path class="sumbu" d="M63.3,280 V48" marker-end="url(#panah)"/>
    <text class="label" x="288" y="269.7" text-anchor="end">x</text>
    <text class="label" x="72.3" y="58">y</text>
    <text class="angka" x="56.3" y="265.7" text-anchor="end">O</text>
    <path class="bantu" d="M63.3,249.7 L146.7,173.8"/>
    <path class="bantu" d="M63.3,249.7 L230,173.8"/>
    <path class="bantu" d="M63.3,249.7 L146.7,97.9"/>
    <polygon class="isi-oranye" points="146.7,173.8 230,173.8 146.7,97.9" stroke-linejoin="round"/>
    <text class="angka" x="154.7" y="191.8" text-anchor="middle">A′</text>
    <text class="angka" x="242" y="189.8" text-anchor="middle">B′</text>
    <text class="angka" x="134.7" y="91.9" text-anchor="middle">C′</text>
    <polygon class="isi-lime" points="105,211.7 146.7,211.7 105,173.8" stroke-linejoin="round"/>
    <text class="angka" x="91" y="217.7" text-anchor="middle">A</text>
    <text class="angka" x="156.7" y="227.7" text-anchor="middle">B</text>
    <text class="angka" x="93" y="171.8" text-anchor="middle">C</text>
    <text class="kecil" x="155" y="306" text-anchor="middle">faktor k = 2: (x, y) → (2x, 2y)</text>
  </g>
</svg>
