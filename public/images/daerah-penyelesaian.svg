<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" role="img" aria-label="Daerah penyelesaian sistem pertidaksamaan x + y ≤ 6, 2x + y ≤ 8, x ≥ 0, y ≥ 0 diarsir lime. Daerah itu berbentuk segi empat dengan titik pojok (0, 0), (4, 0), (2, 4), dan (0, 6). Titik (2, 4) adalah perpotongan garis x + y = 6 dan 2x + y = 8.">
