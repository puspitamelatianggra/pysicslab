<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 344" role="img" aria-label="Tiga panel transformasi grafik y = x², yang digambar putus-putus. Kiri, translasi: grafik digeser 2 satuan ke kanan dan 1 satuan ke atas menjadi y = (x − 2)² + 1, sehingga puncaknya pindah dari (0, 0) ke (2, 1). Tengah, refleksi terhadap sumbu x: grafik dibalik menjadi y = −x² yang terbuka ke bawah. Kanan, dilatasi vertikal faktor 2: grafik direntangkan menjadi y = 2x² yang lebih ramping.">
