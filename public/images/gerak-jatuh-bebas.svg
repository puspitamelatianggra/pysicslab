<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" role="img" aria-label="Diagram gerak jatuh bebas: benda dilepas dari ketinggian h tanpa kecepatan awal, kecepatannya makin besar saat jatuh">
  <defs>
    <style>
      .label { font: 700 16px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .kecil { font: 500 13px Inter, Arial, sans-serif; fill: #475569; }
      .bola { fill: #FF6B00; stroke: #1A1A1A; stroke-width: 2.5; }
      .lintasan { stroke: #475569; stroke-width: 2; stroke-dasharray: 6 5; fill: none; }
      .vektor { stroke: #1A1A1A; stroke-width: 3.5; fill: none; }
      .gravitasi { stroke: #1A1A1A; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
      .ukuran { stroke: #1A1A1A; stroke-width: 2; fill: none; }
      .bantu { stroke: #1A1A1A; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
      .tanah { fill: #C5FA00; stroke: #1A1A1A; stroke-width: 3; }
    </style>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
    <pattern id="arsir" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#1A1A1A" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Tanah -->
  <rect class="tanah" x="40" y="360" width="480" height="16"/>
  <rect x="40" y="360" width="480" height="16" fill="url(#arsir)"/>

  <!-- Ketinggian awal -->
  <path class="bantu" d="M150,70 H286"/>
  <path class="ukuran" d="M150,352 V78" marker-start="url(#panah)" marker-end="url(#panah)"/>
  <text class="label" x="138" y="220" text-anchor="end">h</text>

  <!-- Lintasan jatuh -->
  <path class="lintasan" d="M300,84 V346"/>

  <!-- Dilepas tanpa kecepatan awal -->
  <circle class="bola" cx="300" cy="70" r="13"/>
  <text class="label" x="324" y="76">v<tspan font-size="11" dy="4">0</tspan><tspan dy="-4"> = 0</tspan></text>

  <!-- Makin lama makin cepat -->
  <circle class="bola" cx="300" cy="180" r="13"/>
  <path class="vektor" d="M300,198 V232" marker-end="url(#panah)"/>
  <text class="label" x="316" y="222">v<tspan font-size="11" dy="4">t</tspan></text>

  <circle class="bola" cx="300" cy="275" r="13"/>
  <path class="vektor" d="M300,293 V350" marker-end="url(#panah)"/>
  <text class="label" x="316" y="326">v<tspan font-size="11" dy="4">t</tspan></text>
  <text class="kecil" x="316" y="346">makin cepat</text>

  <!-- Gravitasi -->
  <path class="gravitasi" d="M440,110 V190" marker-end="url(#panah)"/>
  <text class="label" x="456" y="158">g</text>
</svg>
