<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" role="img" aria-label="Diagram segitiga perubahan wujud zat antara padat, cair, dan gas. Proses yang menerima kalor: mencair dari padat ke cair, menguap dari cair ke gas, dan menyublim dari padat ke gas. Proses yang melepas kalor: membeku dari cair ke padat, mengembun dari gas ke cair, dan mengkristal dari gas ke padat">
  <defs>
    <style>
      .wujud { font: 700 18px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .proses { font: 700 14px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .legenda { font: 600 14px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .kotak { fill: #FFFFFF; stroke: #1A1A1A; stroke-width: 2.5; }
      .terima { stroke: #FF6B00; stroke-width: 4; fill: none; }
      .lepas { stroke: #1A1A1A; stroke-width: 2.5; stroke-dasharray: 7 5; fill: none; }
    </style>
    <marker id="panah-terima" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF6B00" stroke="#1A1A1A" stroke-width="1"/>
    </marker>
    <marker id="panah-lepas" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <!-- Wujud zat -->
  <rect class="kotak" x="230" y="40" width="100" height="40"/>
  <text class="wujud" x="280" y="66" text-anchor="middle">Cair</text>
  <rect class="kotak" x="60" y="210" width="100" height="40"/>
  <text class="wujud" x="110" y="236" text-anchor="middle">Padat</text>
  <rect class="kotak" x="400" y="210" width="100" height="40"/>
  <text class="wujud" x="450" y="236" text-anchor="middle">Gas</text>

  <!-- Padat ↔ Cair -->
  <path class="terima" d="M156.4,204.8 L240.4,92.8" marker-end="url(#panah-terima)"/>
  <path class="lepas" d="M227.6,83.2 L143.6,195.2" marker-end="url(#panah-lepas)"/>
  <text class="proses" transform="translate(212,159) rotate(-53.13)" text-anchor="middle" dominant-baseline="middle">mencair</text>
  <text class="proses" transform="translate(172,129) rotate(-53.13)" text-anchor="middle" dominant-baseline="middle">membeku</text>

  <!-- Cair ↔ Gas -->
  <path class="terima" d="M319.6,92.8 L403.6,204.8" marker-end="url(#panah-terima)"/>
  <path class="lepas" d="M416.4,195.2 L332.4,83.2" marker-end="url(#panah-lepas)"/>
  <text class="proses" transform="translate(348,159) rotate(53.13)" text-anchor="middle" dominant-baseline="middle">menguap</text>
  <text class="proses" transform="translate(388,129) rotate(53.13)" text-anchor="middle" dominant-baseline="middle">mengembun</text>

  <!-- Padat ↔ Gas -->
  <path class="terima" d="M166,222 H392" marker-end="url(#panah-terima)"/>
  <path class="lepas" d="M394,238 H168" marker-end="url(#panah-lepas)"/>
  <text class="proses" x="280" y="212" text-anchor="middle">menyublim</text>
  <text class="proses" x="280" y="258" text-anchor="middle">mengkristal</text>

  <!-- Legenda -->
  <path class="terima" d="M150,290 H200" marker-end="url(#panah-terima)"/>
  <text class="legenda" x="212" y="295">menerima (menyerap) kalor</text>
  <path class="lepas" d="M150,314 H200" marker-end="url(#panah-lepas)"/>
  <text class="legenda" x="212" y="319">melepas kalor</text>
</svg>
