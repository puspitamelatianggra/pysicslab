<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Tangki terbuka berisi air dengan lubang kecil di dinding kanan. Lubang berada sedalam h di bawah permukaan air dan setinggi H di atas tanah. Air keluar mendatar dengan kecepatan v lalu jatuh membentuk lintasan parabola dan mendarat sejauh x dari dinding tangki">
  <defs>
    <style>
      .label { font: 700 16px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .air { fill: #A5D8FF; }
      .pancaran { stroke: #3B9AE1; stroke-width: 5; fill: none; stroke-linecap: round; }
      .dinding { stroke: #1A1A1A; stroke-width: 3.5; fill: none; }
      .tanah { stroke: #1A1A1A; stroke-width: 3; }
      .vektor { stroke: #1A1A1A; stroke-width: 3.5; fill: none; }
      .ukur { stroke: #1A1A1A; stroke-width: 1.5; fill: none; }
      .bantu { stroke: #1A1A1A; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
    </style>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <!-- Tangki -->
  <rect class="air" x="80" y="60" width="140" height="200"/>
  <path class="dinding" d="M80,30 V260 H220 V176 M220,164 V30"/>
  <line class="tanah" x1="20" y1="260" x2="500" y2="260"/>

  <!-- Pancaran air: parabola mendarat di x = 2 akar(hH) -->
  <path class="pancaran" d="M220,170 Q319.5,170 419,260"/>
  <path class="vektor" d="M226,152 H270" marker-end="url(#panah)"/>
  <text class="label" x="248" y="144" text-anchor="middle">v</text>

  <!-- Ukuran -->
  <path class="bantu" d="M40,60 H80 M40,170 H220"/>
  <path class="ukur" d="M50,62 V168" marker-start="url(#panah)" marker-end="url(#panah)"/>
  <text class="label" x="42" y="120" text-anchor="end">h</text>
  <path class="ukur" d="M50,172 V258" marker-start="url(#panah)" marker-end="url(#panah)"/>
  <text class="label" x="42" y="220" text-anchor="end">H</text>
  <path class="bantu" d="M419,260 V292"/>
  <path class="ukur" d="M222,282 H417" marker-start="url(#panah)" marker-end="url(#panah)"/>
  <text class="label" x="320" y="276" text-anchor="middle">x</text>
</svg>
