<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" role="img" aria-label="Fluida mengalir dari pipa lebar berpenampang A1 ke pipa sempit berpenampang A2. Diameter pipa sempit setengah diameter pipa lebar, sehingga luasnya seperempat. Dalam selang waktu yang sama, volume yang sama mengalir: di pipa lebar fluida bergerak sejauh l1 sama dengan v1 delta t, dan di pipa sempit bergerak empat kali lebih jauh, l2 sama dengan v2 delta t">
  <defs>
    <style>
      .label { font: 700 16px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .kecil { font: 600 13px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .air { fill: #A5D8FF; }
      .elemen { fill: #FF6B00; fill-opacity: 0.45; }
      .dinding { stroke: #1A1A1A; stroke-width: 3; fill: none; stroke-linejoin: round; }
      .penampang { stroke: #1A1A1A; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
      .vektor { stroke: #1A1A1A; stroke-width: 3.5; fill: none; }
      .ukur { stroke: #1A1A1A; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <!-- Fluida -->
  <polygon class="air" points="40,70 250,70 300,90 520,90 520,130 300,130 250,150 40,150"/>

  <!-- Elemen volume yang sama -->
  <rect class="elemen" x="90" y="70" width="24" height="80"/>
  <rect class="elemen" x="424" y="90" width="96" height="40"/>
  <ellipse class="penampang" cx="90" cy="110" rx="10" ry="40"/>
  <ellipse class="penampang" cx="424" cy="110" rx="5" ry="20"/>

  <!-- Dinding pipa -->
  <path class="dinding" d="M40,70 H250 L300,90 H520 M40,150 H250 L300,130 H520"/>

  <!-- Kecepatan -->
  <path class="vektor" d="M150,110 H180" marker-end="url(#panah)"/>
  <text class="label" x="165" y="100" text-anchor="middle">v<tspan font-size="11" dy="4">1</tspan></text>
  <path class="vektor" d="M300,110 H420" marker-end="url(#panah)"/>
  <text class="label" x="360" y="82" text-anchor="middle">v<tspan font-size="11" dy="4">2</tspan></text>

  <!-- Panjang elemen -->
  <path class="ukur" d="M90,58 H114" marker-start="url(#panah)" marker-end="url(#panah)"/>
  <text class="kecil" x="102" y="46" text-anchor="middle">l₁ = v₁Δt</text>
  <path class="ukur" d="M424,78 H520" marker-start="url(#panah)" marker-end="url(#panah)"/>
  <text class="kecil" x="472" y="66" text-anchor="middle">l₂ = v₂Δt</text>

  <text class="label" x="90" y="176" text-anchor="middle">A<tspan font-size="11" dy="4">1</tspan></text>
  <text class="label" x="424" y="156" text-anchor="middle">A<tspan font-size="11" dy="4">2</tspan></text>
</svg>
