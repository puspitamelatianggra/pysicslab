<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Kiri, dot plot banyak buku yang dibaca 15 siswa dalam sebulan: 1 buku 2 siswa, 2 buku 4 siswa, 3 buku 5 siswa, 4 buku 2 siswa, 5 buku 1 siswa, dan 6 buku 1 siswa. Kanan, histogram tinggi badan 40 siswa dengan tepi kelas 149,5 sampai 174,5 cm. Frekuensi tiap kelas berturut-turut 4, 10, 14, 8, dan 4; batang-batangnya saling menempel.">
  <defs>
