<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 342" role="img" aria-label="Tiga grafik parabola terbuka ke atas. Kiri, D lebih dari 0: parabola y = x² − 2x − 3 memotong sumbu x di dua titik, x = −1 dan x = 3. Tengah, D sama dengan 0: parabola y = x² − 2x + 1 menyinggung sumbu x di satu titik, x = 1. Kanan, D kurang dari 0: parabola y = x² − 2x + 3 tidak memotong sumbu x, sehingga akarnya imajiner.">
