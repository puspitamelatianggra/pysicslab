<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 346" role="img" aria-label="Grafik gaya gesek terhadap gaya tarik. Saat benda diam, gaya gesek statis sama dengan gaya tarik dan naik hingga nilai maksimum. Setelah benda bergerak, gaya gesek turun menjadi gaya gesek kinetis yang nilainya tetap">
  <defs>
    <style>
      .bayang { fill: #1A1A1A; }
      .panel { fill: #FFFFFF; stroke: #1A1A1A; stroke-width: 3; }
      .kepala { fill: #C5FA00; stroke: #1A1A1A; stroke-width: 3; }
      .judul { font: 700 16px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .label { font: 700 15px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .kecil { font: 500 12.5px Inter, Arial, sans-serif; fill: #475569; }
      .sumbu { stroke: #1A1A1A; stroke-width: 2.5; fill: none; }
      .grafik { stroke: #FF6B00; stroke-width: 4.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .bantu { stroke: #1A1A1A; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
      .daerah { fill: #C5FA00; opacity: 0.35; }
    </style>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <g transform="translate(4,4)">
    <rect class="bayang" x="6" y="6" width="450" height="330"/>
    <rect class="panel" x="0" y="0" width="450" height="330"/>
    <rect class="kepala" x="0" y="0" width="450" height="42"/>
    <text class="judul" x="16" y="27">Gaya gesek (f) terhadap gaya tarik (F)</text>

    <rect class="daerah" x="60" y="62" width="160" height="218"/>

    <path class="sumbu" d="M60,280 V62" marker-end="url(#panah)"/>
    <path class="sumbu" d="M60,280 H432" marker-end="url(#panah)"/>
    <text class="label" x="70" y="76">f (N)</text>
    <text class="label" x="430" y="304" text-anchor="end">F (N)</text>
    <text class="label" x="50" y="296" text-anchor="end">0</text>

    <path class="bantu" d="M60,120 H220 V280"/>
    <path class="grafik" d="M60,280 L220,120 L232,160 H420"/>

    <text class="label" x="66" y="112">f<tspan font-size="11" dy="4">s,maks</tspan><tspan dy="-4"> = μ</tspan><tspan font-size="11" dy="4">s</tspan><tspan dy="-4">N</tspan></text>
    <text class="label" x="300" y="150">f<tspan font-size="11" dy="4">k</tspan><tspan dy="-4"> = μ</tspan><tspan font-size="11" dy="4">k</tspan><tspan dy="-4">N</tspan></text>
    <text class="kecil" x="150" y="226">f = F</text>
    <text class="kecil" x="140" y="300" text-anchor="middle">benda diam</text>
    <text class="kecil" x="320" y="300" text-anchor="middle">benda bergerak</text>
  </g>
</svg>
