<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-label="Benda bermassa m bergerak melingkar. Kecepatan v menyinggung lingkaran, sedangkan percepatan sentripetal dan gaya sentripetal mengarah ke pusat lingkaran">
  <defs>
    <style>
      .label { font: 700 16px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .lingkaran { stroke: #1A1A1A; stroke-width: 2.5; fill: none; }
      .vektor { stroke: #1A1A1A; stroke-width: 3.5; fill: none; }
      .komponen { stroke: #FF6B00; stroke-width: 3.5; fill: none; }
      .bantu { stroke: #1A1A1A; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
      .benda { fill: #FF6B00; stroke: #1A1A1A; stroke-width: 2.5; }
      .pusat { fill: #1A1A1A; }
    </style>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="panah-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF6B00"/>
    </marker>
  </defs>

  <circle class="lingkaran" cx="210" cy="160" r="110"/>
  <circle class="pusat" cx="210" cy="160" r="4"/>

  <!-- Jari-jari -->
  <path class="bantu" d="M155,64.7 L210,160"/>
  <text class="label" x="218" y="150">r</text>

  <!-- Percepatan / gaya sentripetal ke pusat -->
  <path class="komponen" d="M155,64.7 L190,125.3" marker-end="url(#panah-o)"/>
  <text class="label" x="168" y="128" text-anchor="end">a<tspan font-size="11" dy="4">s</tspan><tspan dy="-4">, F</tspan><tspan font-size="11" dy="4">s</tspan></text>

  <!-- Kecepatan menyinggung lintasan -->
  <path class="vektor" d="M155,64.7 L85.7,104.7" marker-end="url(#panah)"/>
  <text class="label" x="78" y="124" text-anchor="end">v</text>

  <circle class="benda" cx="155" cy="64.7" r="12"/>
  <text class="label" x="150" y="38" text-anchor="middle">m</text>
</svg>
