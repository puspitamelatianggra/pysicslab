<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" role="img" aria-label="Grafik gaya F terhadap waktu t. Gaya naik dari nol pada t1, mencapai puncak, lalu turun lagi ke nol pada t2. Luas daerah di bawah kurva sama dengan impuls. Persegi panjang setinggi F rata-rata selebar delta t memiliki luas yang sama">
  <defs>
    <style>
      .label { font: 700 16px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .kecil { font: 600 13px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .sumbu { stroke: #1A1A1A; stroke-width: 2.5; fill: none; }
      .kurva { stroke: #1A1A1A; stroke-width: 3; fill: #FF6B00; fill-opacity: 0.3; }
      .rata { stroke: #475569; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
      .ukur { stroke: #1A1A1A; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <!-- Sumbu -->
  <path class="sumbu" d="M70,230 H480" marker-end="url(#panah)"/>
  <path class="sumbu" d="M70,230 V25" marker-end="url(#panah)"/>
  <text class="label" x="56" y="34" text-anchor="end">F</text>
  <text class="label" x="488" y="250">t</text>

  <!-- Kurva gaya, luasnya = impuls -->
  <path class="kurva" d="M130,230 C200,230 220,50 270,50 C320,50 340,230 410,230 Z"/>
  <text class="label" x="270" y="200" text-anchor="middle">I = luas</text>

  <!-- Gaya rata-rata: luas persegi panjang = luas di bawah kurva -->
  <path class="rata" d="M70,147.7 H410 V230 M130,147.7 V230"/>
  <text class="kecil" x="416" y="152">F<tspan font-size="10" dy="4">rata-rata</tspan></text>

  <!-- Selang waktu -->
  <text class="label" x="130" y="252" text-anchor="middle">t<tspan font-size="11" dy="4">1</tspan></text>
  <text class="label" x="410" y="252" text-anchor="middle">t<tspan font-size="11" dy="4">2</tspan></text>
  <path class="ukur" d="M145,266 H395" marker-start="url(#panah)" marker-end="url(#panah)"/>
  <text class="kecil" x="270" y="262" text-anchor="middle">Δt</text>
</svg>
