<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" role="img" aria-label="Dongkrak hidrolik. Pengisap kecil dengan luas A1 ditekan gaya F1 ke bawah. Tekanan diteruskan sama besar oleh zat cair ke pengisap besar dengan luas A2, sehingga pengisap besar mendorong beban dengan gaya F2 ke atas yang jauh lebih besar">
  <defs>
    <style>
      .label { font: 700 16px "Space Grotesk", Arial, sans-serif; fill: #1A1A1A; }
      .rumus { font: 700 16px "Space Grotesk", Arial, sans-serif; fill: #FF6B00; }
      .air { fill: #A5D8FF; }
      .dinding { stroke: #1A1A1A; stroke-width: 3.5; fill: none; stroke-linejoin: round; }
      .pengisap { fill: #475569; stroke: #1A1A1A; stroke-width: 2; }
      .beban { fill: #C5FA00; stroke: #1A1A1A; stroke-width: 2.5; }
      .vektor { stroke: #1A1A1A; stroke-width: 4; fill: none; }
      .vektor-besar { stroke: #FF6B00; stroke-width: 6; fill: none; }
      .tekan { stroke: #1A1A1A; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="panah-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF6B00"/>
    </marker>
    <marker id="panah-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <!-- Zat cair -->
  <path class="air" d="M80,120 H130 V200 H280 V110 H440 V250 H80 Z"/>

  <!-- Wadah -->
  <path class="dinding" d="M80,60 V250 H440 V60 M130,60 V200 H280 V60"/>

  <!-- Pengisap -->
  <rect class="pengisap" x="82" y="108" width="46" height="12"/>
  <rect class="pengisap" x="282" y="98" width="156" height="12"/>
  <rect class="beban" x="310" y="58" width="100" height="40" rx="4"/>

  <!-- Gaya -->
  <path class="vektor" d="M105,40 V100" marker-end="url(#panah)"/>
  <text class="label" x="115" y="52">F<tspan font-size="11" dy="4">1</tspan></text>
  <path class="vektor-besar" d="M360,58 V14" marker-end="url(#panah-o)"/>
  <text class="label" x="372" y="30">F<tspan font-size="11" dy="4">2</tspan></text>

  <!-- Tekanan diteruskan ke segala arah -->
  <path class="tekan" d="M205,225 H178" marker-end="url(#panah-k)"/>
  <path class="tekan" d="M205,225 H232" marker-end="url(#panah-k)"/>
  <path class="tekan" d="M205,225 V207" marker-end="url(#panah-k)"/>
  <path class="tekan" d="M205,225 V245" marker-end="url(#panah-k)"/>

  <text class="label" x="105" y="145" text-anchor="middle">A<tspan font-size="11" dy="4">1</tspan></text>
  <text class="label" x="360" y="140" text-anchor="middle">A<tspan font-size="11" dy="4">2</tspan></text>
  <text class="rumus" x="260" y="276" text-anchor="middle">P<tspan font-size="11" dy="4">1</tspan><tspan dy="-4"> = P</tspan><tspan font-size="11" dy="4">2</tspan></text>
</svg>
