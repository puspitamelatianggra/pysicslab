<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Pengamat di puncak gedung melihat ke bawah ke arah mobil di tanah. Sudut antara garis mendatar dan garis pandang ke bawah disebut sudut depresi. Dari mobil, sudut antara tanah dan garis pandang ke atas menuju pengamat disebut sudut elevasi. Kedua sudut itu sama besar karena garis mendatar sejajar dengan tanah.">
  <defs>
